# Buy Me a Coffee - Creator donation platform
id: buymeacoffee
display_name: Buy Me a Coffee
category: creative
homepage: https://www.buymeacoffee.com

profile_url_template: "https://www.buymeacoffee.com/{username}"

detection:
  strategy: status_code
  status_code:
    success_codes: [200]
    not_found_codes: [404]

network:
  timeout_seconds: 6
  retries: 2
  backoff: exponential
  base_delay_ms: 250

rate_limit:
  requests_per_minute: 40
  scope: global

auth:
  login_required: false
  captcha_risk: low

confidence_rules:
  base_reliability: 0.88
  verification_method: html_scrape
  corroboration_fields: []

parser:
  type: html
  fields: {}

normalizer: username.normalizer.default
enabled: true
tags:
  - creator
  - donation
notes: "Buy Me a Coffee creator profile page."
