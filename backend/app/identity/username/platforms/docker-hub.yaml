# Docker Hub - Container registry
id: docker-hub
display_name: Docker Hub
category: developer
homepage: https://hub.docker.com

profile_url_template: "https://hub.docker.com/u/{username}"

detection:
  strategy: status_code
  status_code:
    success_codes: [200]
    not_found_codes: [404]

network:
  timeout_seconds: 8
  retries: 2
  backoff: exponential
  base_delay_ms: 300

rate_limit:
  requests_per_minute: 20
  scope: global

auth:
  login_required: false
  captcha_risk: low

confidence_rules:
  base_reliability: 0.82
  verification_method: html_scrape
  corroboration_fields: []

parser:
  type: html
  fields: {}

normalizer: username.normalizer.default
enabled: true
tags:
  - developer
  - containers
  - registry
  - medium-confidence
notes: "Docker Hub user profiles. Status code based detection."
