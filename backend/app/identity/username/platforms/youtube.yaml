# YouTube - Video sharing platform
id: youtube
display_name: YouTube
category: social
homepage: https://www.youtube.com

profile_url_template: "https://www.youtube.com/@{username}"

detection:
  strategy: status_code
  status_code:
    success_codes: [200]
    not_found_codes: [404]

network:
  timeout_seconds: 8
  retries: 2
  backoff: exponential
  base_delay_ms: 300

rate_limit:
  requests_per_minute: 15
  scope: global

auth:
  login_required: false
  captcha_risk: medium
  api_key_required: false

confidence_rules:
  base_reliability: 0.75
  verification_method: html_scrape
  corroboration_fields: []

parser:
  type: html
  fields: {}

normalizer: username.normalizer.default
enabled: true
tags:
  - social
  - video-sharing
  - medium-confidence
notes: "YouTube custom URLs with @ symbol. Google API requires authentication. Status code detection."
