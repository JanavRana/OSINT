# X (formerly Twitter) - Social media platform
id: x
display_name: X (Twitter)
category: social
homepage: https://x.com

profile_url_template: "https://x.com/{username}"

detection:
  strategy: status_code
  status_code:
    success_codes: [200]
    not_found_codes: [404]

network:
  timeout_seconds: 8
  retries: 2
  backoff: exponential
  base_delay_ms: 500

rate_limit:
  requests_per_minute: 10
  scope: global

auth:
  login_required: false
  captcha_risk: high

confidence_rules:
  base_reliability: 0.70
  verification_method: html_scrape
  corroboration_fields: []

parser:
  type: html
  fields: {}

normalizer: username.normalizer.default
enabled: true
tags:
  - social
  - microblogging
  - medium-confidence
notes: "X/Twitter requires authentication for API. Status code based detection. High CAPTCHA risk."
