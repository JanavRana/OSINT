# Platform Registry
# Lists all platform definition files to be loaded
#
# To add a new platform:
# 1. Create a YAML file in this directory following PlatformDefinition schema
# 2. Add the filename to the platforms list below
# 3. Platform will be automatically loaded and validated on startup

platforms:
  # Developer platforms
  - github.yaml
  - gitlab.yaml
  - leetcode.yaml
  - codeforces.yaml
  - hackerrank.yaml
  - codechef.yaml
  - codepen.yaml
  - npm.yaml
  - docker-hub.yaml

