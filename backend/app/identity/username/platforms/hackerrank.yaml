# HackerRank - Coding practice and hiring platform
id: hackerrank
display_name: HackerRank
category: developer
homepage: https://www.hackerrank.com

profile_url_template: "https://www.hackerrank.com/profile/{username}"

detection:
  strategy: status_code
  status_code:
    success_codes: [200]
    not_found_codes: [404]

network:
  timeout_seconds: 8
  retries: 2
  backoff: exponential
  base_delay_ms: 300

rate_limit:
  requests_per_minute: 15
  scope: global

auth:
  login_required: false
  captcha_risk: medium

confidence_rules:
  base_reliability: 0.75
  verification_method: html_scrape
  corroboration_fields: []

parser:
  type: html
  fields: {}

normalizer: username.normalizer.default
enabled: true
tags:
  - developer
  - competitive-programming
  - medium-confidence
notes: "HackerRank doesn't have public API. Status code detection only."
