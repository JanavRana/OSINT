# SoundCloud - Music and audio platform
id: soundcloud
display_name: SoundCloud
category: social
homepage: https://soundcloud.com

profile_url_template: "https://soundcloud.com/{username}"

detection:
  strategy: status_code
  status_code:
    success_codes: [200]
    not_found_codes: [404]

network:
  timeout_seconds: 8
  retries: 2
  backoff: exponential
  base_delay_ms: 300

rate_limit:
  requests_per_minute: 15
  scope: global

auth:
  login_required: false
  captcha_risk: medium

confidence_rules:
  base_reliability: 0.76
  verification_method: html_scrape
  corroboration_fields: []

parser:
  type: html
  fields: {}

normalizer: username.normalizer.default
enabled: true
tags:
  - social
  - music
  - audio
  - medium-confidence
notes: "SoundCloud API requires authentication. Status code detection."
