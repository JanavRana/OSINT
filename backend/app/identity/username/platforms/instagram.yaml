# Instagram - Photo and video sharing platform
id: instagram
display_name: Instagram
category: social
homepage: https://www.instagram.com

profile_url_template: "https://www.instagram.com/{username}/"

detection:
  strategy: status_code
  status_code:
    success_codes: [200]
    not_found_codes: [404]

network:
  timeout_seconds: 8
  retries: 2
  backoff: exponential
  base_delay_ms: 500

rate_limit:
  requests_per_minute: 10
  scope: global

auth:
  login_required: false
  captcha_risk: high

confidence_rules:
  base_reliability: 0.68
  verification_method: html_scrape
  corroboration_fields: []

parser:
  type: html
  fields: {}

normalizer: username.normalizer.default
enabled: true
tags:
  - social
  - photo-sharing
  - medium-confidence
notes: "Instagram requires authentication for API access. Status code detection only. High rate limiting and CAPTCHA risk."
