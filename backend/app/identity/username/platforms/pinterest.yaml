# Pinterest - Visual discovery and bookmarking platform
id: pinterest
display_name: Pinterest
category: social
homepage: https://www.pinterest.com

profile_url_template: "https://www.pinterest.com/{username}/"

detection:
  strategy: status_code
  status_code:
    success_codes: [200]
    not_found_codes: [404]

network:
  timeout_seconds: 8
  retries: 2
  backoff: exponential
  base_delay_ms: 400

rate_limit:
  requests_per_minute: 15
  scope: global

auth:
  login_required: false
  captcha_risk: medium

confidence_rules:
  base_reliability: 0.72
  verification_method: html_scrape
  corroboration_fields: []

parser:
  type: html
  fields: {}

normalizer: username.normalizer.default
enabled: true
tags:
  - social
  - visual-content
  - medium-confidence
notes: "Pinterest API requires authentication. Status code detection with moderate CAPTCHA risk."
