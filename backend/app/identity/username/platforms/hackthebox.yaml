# HackTheBox - Cybersecurity training & CTF
id: hackthebox
display_name: HackTheBox
category: developer
homepage: https://www.hackthebox.com

profile_url_template: "https://app.hackthebox.com/users/{username}"

detection:
  strategy: status_code
  status_code:
    success_codes: [200]
    not_found_codes: [404]

network:
  timeout_seconds: 8
  retries: 2
  backoff: exponential
  base_delay_ms: 300

rate_limit:
  requests_per_minute: 30
  scope: global

auth:
  login_required: false
  captcha_risk: low

confidence_rules:
  base_reliability: 0.85
  verification_method: html_scrape
  corroboration_fields: []

parser:
  type: html
  fields: {}

normalizer: username.normalizer.default
enabled: true
tags:
  - cybersecurity
  - ctf
  - developer
notes: "HackTheBox public profile page check."
