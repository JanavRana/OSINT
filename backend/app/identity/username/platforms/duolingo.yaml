# Duolingo - Language learning platform
id: duolingo
display_name: Duolingo
category: other
homepage: https://www.duolingo.com

profile_url_template: "https://www.duolingo.com/profile/{username}"
api_endpoint: "https://www.duolingo.com/2017-06-30/users?username={username}"

detection:
  strategy: json_api
  json_api:
    success_field: "$.users[0].id"
    not_found_status: 404

network:
  timeout_seconds: 6
  retries: 2
  backoff: exponential
  base_delay_ms: 250

rate_limit:
  requests_per_minute: 30
  scope: global

auth:
  login_required: false
  captcha_risk: low

confidence_rules:
  base_reliability: 0.95
  verification_method: api_confirmed
  corroboration_fields:
    - display_name
    - avatar_url

parser:
  type: json
  fields:
    display_name: "$.users[0].name"
    avatar_url: "$.users[0].picture"
    bio: "$.users[0].bio"

normalizer: username.normalizer.default
enabled: true
tags:
  - education
  - learning
  - high-confidence
  - api-based
notes: "Duolingo public user lookup REST endpoint."
