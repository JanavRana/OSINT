# ArtStation - Portfolio site for visual artists
id: artstation
display_name: ArtStation
category: creative
homepage: https://www.artstation.com

profile_url_template: "https://www.artstation.com/{username}"
api_endpoint: "https://www.artstation.com/users/{username}.json"

detection:
  strategy: json_api
  json_api:
    success_field: "$.id"
    not_found_status: 404

network:
  timeout_seconds: 6
  retries: 2
  backoff: exponential
  base_delay_ms: 250

rate_limit:
  requests_per_minute: 40
  scope: global

auth:
  login_required: false
  captcha_risk: low

confidence_rules:
  base_reliability: 0.95
  verification_method: api_confirmed
  corroboration_fields:
    - display_name
    - avatar_url

parser:
  type: json
  fields:
    display_name: "$.full_name"
    avatar_url: "$.large_avatar_url"
    headline: "$.headline"

normalizer: username.normalizer.default
enabled: true
tags:
  - art
  - portfolio
  - creative
  - api-based
notes: "ArtStation public user profile endpoint."
