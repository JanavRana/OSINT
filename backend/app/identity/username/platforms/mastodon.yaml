# Mastodon - Decentralized social network
# Note: This checks mastodon.social, the main instance
id: mastodon
display_name: Mastodon
category: professional
homepage: https://joinmastodon.org

profile_url_template: "https://mastodon.social/@{username}"
api_endpoint: "https://mastodon.social/api/v1/accounts/lookup?acct={username}"

detection:
  strategy: json_api
  json_api:
    success_field: "$.username"
    not_found_status: 404

network:
  timeout_seconds: 8
  retries: 2
  backoff: exponential
  base_delay_ms: 300

rate_limit:
  requests_per_minute: 20
  scope: global

auth:
  login_required: false
  captcha_risk: low

confidence_rules:
  base_reliability: 0.85
  verification_method: api_confirmed
  corroboration_fields:
    - display_name
    - avatar_url
    - bio

parser:
  type: json
  fields:
    display_name: "$.display_name"
    avatar_url: "$.avatar"
    bio: "$.note"
    account_created: "$.created_at"
    followers: "$.followers_count"

normalizer: username.normalizer.default
enabled: true
tags:
  - social
  - decentralized
  - high-confidence
  - api-based
notes: "Checks mastodon.social instance only. Other instances would need separate configs."
