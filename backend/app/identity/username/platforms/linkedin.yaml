# LinkedIn - Professional networking platform
id: linkedin
display_name: LinkedIn
category: professional
homepage: https://www.linkedin.com

profile_url_template: "https://www.linkedin.com/in/{username}"

detection:
  strategy: status_code
  status_code:
    success_codes: [200]
    not_found_codes: [404]

network:
  timeout_seconds: 10
  retries: 2
  backoff: exponential
  base_delay_ms: 500

rate_limit:
  requests_per_minute: 8
  scope: global

auth:
  login_required: false
  captcha_risk: high

confidence_rules:
  base_reliability: 0.65
  verification_method: html_scrape
  corroboration_fields: []

parser:
  type: html
  fields: {}

normalizer: username.normalizer.default
enabled: true
tags:
  - professional
  - networking
  - medium-confidence
notes: "LinkedIn has aggressive anti-scraping and requires login for API. High CAPTCHA risk. Limited reliability without authentication."
