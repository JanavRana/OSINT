# Tumblr - Microblogging platform
id: tumblr
display_name: Tumblr
category: social
homepage: https://www.tumblr.com

profile_url_template: "https://{username}.tumblr.com"

detection:
  strategy: status_code
  status_code:
    success_codes: [200]
    not_found_codes: [404]

network:
  timeout_seconds: 8
  retries: 2
  backoff: exponential
  base_delay_ms: 300

rate_limit:
  requests_per_minute: 15
  scope: global

auth:
  login_required: false
  captcha_risk: low

confidence_rules:
  base_reliability: 0.75
  verification_method: html_scrape
  corroboration_fields: []

parser:
  type: html
  fields: {}

normalizer: username.normalizer.default
enabled: true
tags:
  - social
  - blogging
  - medium-confidence
notes: "Tumblr uses subdomain format. API requires authentication. Status code detection."
