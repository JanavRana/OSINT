# Steam - Gaming platform
id: steam
display_name: Steam
category: gaming
homepage: https://steamcommunity.com

profile_url_template: "https://steamcommunity.com/id/{username}"

detection:
  strategy: status_code
  status_code:
    success_codes: [200]
    not_found_codes: [404]

network:
  timeout_seconds: 8
  retries: 2
  backoff: exponential
  base_delay_ms: 300

rate_limit:
  requests_per_minute: 20
  scope: global

auth:
  login_required: false
  captcha_risk: low

confidence_rules:
  base_reliability: 0.82
  verification_method: html_scrape
  corroboration_fields: []

parser:
  type: html
  fields: {}

normalizer: username.normalizer.default
enabled: true
tags:
  - gaming
  - medium-confidence
notes: "Steam custom URL profiles. API requires authentication. Status code based."
