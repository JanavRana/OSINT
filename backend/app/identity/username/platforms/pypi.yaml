# PyPI - Python Package Index
id: pypi
display_name: PyPI
category: developer
homepage: https://pypi.org

profile_url_template: "https://pypi.org/user/{username}/"

detection:
  strategy: status_code
  status_code:
    success_codes: [200]
    not_found_codes: [404]

network:
  timeout_seconds: 6
  retries: 2
  backoff: exponential
  base_delay_ms: 250

rate_limit:
  requests_per_minute: 25
  scope: global

auth:
  login_required: false
  captcha_risk: low

confidence_rules:
  base_reliability: 0.85
  verification_method: html_scrape
  corroboration_fields: []

parser:
  type: html
  fields: {}

normalizer: username.normalizer.default
enabled: true
tags:
  - developer
  - package-registry
  - python
  - medium-confidence
notes: "PyPI user profiles are public. Status code based detection."
