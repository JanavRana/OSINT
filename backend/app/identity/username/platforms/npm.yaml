# npm - Node Package Manager
id: npm
display_name: npm
category: developer
homepage: https://www.npmjs.com

profile_url_template: "https://www.npmjs.com/~{username}"

detection:
  strategy: status_code
  status_code:
    success_codes: [200]
    not_found_codes: [404]

network:
  timeout_seconds: 6
  retries: 2
  backoff: exponential
  base_delay_ms: 250

rate_limit:
  requests_per_minute: 25
  scope: global

auth:
  login_required: false
  captcha_risk: low

confidence_rules:
  base_reliability: 0.85
  verification_method: html_scrape
  corroboration_fields: []

parser:
  type: html
  fields: {}

normalizer: username.normalizer.default
enabled: true
tags:
  - developer
  - package-registry
  - medium-confidence
notes: "npm user profiles use ~ prefix. Public registry data. Status code reliable."
