# Flickr - Photo sharing platform
id: flickr
display_name: Flickr
category: social
homepage: https://www.flickr.com

profile_url_template: "https://www.flickr.com/people/{username}"

detection:
  strategy: status_code
  status_code:
    success_codes: [200]
    not_found_codes: [404]

network:
  timeout_seconds: 8
  retries: 2
  backoff: exponential
  base_delay_ms: 300

rate_limit:
  requests_per_minute: 20
  scope: global

auth:
  login_required: false
  captcha_risk: low
  api_key_required: false

confidence_rules:
  base_reliability: 0.78
  verification_method: html_scrape
  corroboration_fields: []

parser:
  type: html
  fields: {}

normalizer: username.normalizer.default
enabled: true
tags:
  - social
  - photography
  - medium-confidence
notes: "Flickr API exists but requires key. Public profile via status code."
