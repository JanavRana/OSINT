# Linktree - Social media reference landing page
id: linktree
display_name: Linktree
category: social
homepage: https://linktr.ee

profile_url_template: "https://linktr.ee/{username}"

detection:
  strategy: status_code
  status_code:
    success_codes: [200]
    not_found_codes: [404]

network:
  timeout_seconds: 6
  retries: 2
  backoff: exponential
  base_delay_ms: 250

rate_limit:
  requests_per_minute: 40
  scope: global

auth:
  login_required: false
  captcha_risk: low

confidence_rules:
  base_reliability: 0.90
  verification_method: html_scrape
  corroboration_fields: []

parser:
  type: html
  fields: {}

normalizer: username.normalizer.default
enabled: true
tags:
  - bio-link
  - aggregator
  - high-confidence
notes: "Linktree public profile link."
