# Vimeo - Video sharing platform
id: vimeo
display_name: Vimeo
category: social
homepage: https://vimeo.com

profile_url_template: "https://vimeo.com/{username}"
api_endpoint: "https://api.vimeo.com/users/{username}"

detection:
  strategy: status_code
  status_code:
    success_codes: [200]
    not_found_codes: [404]

network:
  timeout_seconds: 8
  retries: 2
  backoff: exponential
  base_delay_ms: 300

rate_limit:
  requests_per_minute: 20
  scope: global

auth:
  login_required: false
  captcha_risk: low
  api_key_required: false

confidence_rules:
  base_reliability: 0.80
  verification_method: html_scrape
  corroboration_fields: []

parser:
  type: html
  fields: {}

normalizer: username.normalizer.default
enabled: true
tags:
  - social
  - video-sharing
  - creative
  - medium-confidence
notes: "Vimeo API requires authentication. Public profile via status code."
