# Discord - Chat and community platform
# Note: Discord usernames are not directly accessible via public URLs
# This platform is DISABLED as it cannot be reliably checked without authentication
id: discord
display_name: Discord
category: gaming
homepage: https://discord.com

profile_url_template: "https://discord.com/users/{username}"

detection:
  strategy: status_code
  status_code:
    success_codes: [200]
    not_found_codes: [404]

network:
  timeout_seconds: 8
  retries: 2
  backoff: exponential
  base_delay_ms: 300

rate_limit:
  requests_per_minute: 10
  scope: global

auth:
  login_required: true
  captcha_risk: high

confidence_rules:
  base_reliability: 0.45
  verification_method: html_scrape
  corroboration_fields: []

parser:
  type: html
  fields: {}

normalizer: username.normalizer.default
enabled: false
tags:
  - gaming
  - chat
  - disabled
notes: "DISABLED: Discord does not have public username profiles. Requires authentication and user ID (not username). Cannot reliably check username existence via public interface."
