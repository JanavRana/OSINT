# Roblox - Gaming and virtual world platform
id: roblox
display_name: Roblox
category: gaming
homepage: https://www.roblox.com

profile_url_template: "https://www.roblox.com/user.aspx?username={username}"

detection:
  strategy: status_code
  status_code:
    success_codes: [200]
    not_found_codes: [404]

network:
  timeout_seconds: 8
  retries: 2
  backoff: exponential
  base_delay_ms: 300

rate_limit:
  requests_per_minute: 30
  scope: global

auth:
  login_required: false
  captcha_risk: low

confidence_rules:
  base_reliability: 0.85
  verification_method: html_scrape
  corroboration_fields: []

parser:
  type: html
  fields: {}

normalizer: username.normalizer.default
enabled: true
tags:
  - gaming
  - medium-confidence
notes: "Roblox profile check based on web response."
